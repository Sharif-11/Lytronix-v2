<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/lytronix-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lytronix" />
    <title>Lytronix Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Static, framework-free splash — visible immediately while the JS
         bundle downloads/parses, before React ever mounts. main.jsx fades
         and removes #app-splash right after the first render. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0b08;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(74, 125, 30, 0.35);
        animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #app-splash .splash-name {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.02em;
        color: #ffffff;
      }
      #app-splash .splash-tagline {
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: -14px;
      }
      #app-splash .splash-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2.5px solid rgba(74, 125, 30, 0.25);
        border-top-color: #76c043;
        animation: splash-spin 0.8s linear infinite;
        margin-top: 6px;
      }
      @keyframes splash-pop {
        0% { transform: scale(0.7); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
        #app-splash .splash-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <img src="/lytronix-mark.png" alt="" />
      <div class="splash-name">Lytronix</div>
      <div class="splash-tagline">Admin panel</div>
      <div class="splash-spinner" role="status" aria-label="Loading"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
